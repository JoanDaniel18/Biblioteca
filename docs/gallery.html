<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galería · Biblioteca Somos Uno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .head {
      padding: 64px 0 32px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .head h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .head p {
      margin: 12px 0 0;
      max-width: 50ch;
      color: var(--muted);
      font-size: 1.04rem;
    }

    .verse {
      margin: 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 0.92rem;
      font-style: italic;
    }

    .verse small { display: block; margin-top: 4px; font-style: normal; color: var(--faint); }

    .stage {
      position: relative;
      aspect-ratio: 16 / 10;
      max-height: 72vh;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 180ms ease;
    }

    .stage img.is-changing { opacity: 0; }

    .stage-backdrop {
      position: absolute;
      inset: -40px;
      background-size: cover;
      background-position: center;
      filter: blur(40px) saturate(1.1);
      opacity: 0.35;
      transition: background-image 200ms ease;
    }

    .stage img { position: relative; }

    .stage-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 16px rgba(17, 19, 18, 0.16);
      transition: transform 150ms ease, background 150ms ease;
    }

    .stage-nav:hover { background: #fff; transform: translateY(-50%) scale(1.06); }
    .stage-nav.prev { left: 16px; }
    .stage-nav.next { right: 16px; }

    .count {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(17, 19, 18, 0.6);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .thumb {
      padding: 0;
      border: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: var(--surface);
      opacity: 0.55;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: opacity 150ms ease, outline-color 150ms ease;
    }

    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb:hover { opacity: 0.85; }
    .thumb.is-active { opacity: 1; outline-color: var(--ink); }

    .message { padding: 72px 16px; text-align: center; color: var(--muted); }

    @media (max-width: 760px) {
      .head { padding: 36px 0 24px; }
      .stage { aspect-ratio: 4 / 3; border-radius: 14px; }
      .stage-nav { width: 38px; height: 38px; }
      .thumbs { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="shell">
      <a class="brand" href="index.html">
        <span class="brand-mark">SU</span>
        <span>Somos Uno<small>Biblioteca bautista reformada</small></span>
      </a>
      <nav class="nav" aria-label="Navegación principal">
        <a href="index.html">Biblioteca</a>
        <a href="gallery.html" aria-current="page">Galería</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="head fade-in">
      <div>
        <h1>Vida de iglesia</h1>
        <p>Momentos de la comunión de la Misión Reformada “Somos Uno”.</p>
      </div>
      <p class="verse">“Un mandamiento nuevo os doy: que os améis unos a otros.”<small>Juan 13:34</small></p>
    </section>

    <section id="galeria" class="fade-in" aria-label="Galería de fotos">
      <div class="stage" id="stage">
        <div class="stage-backdrop" id="backdrop"></div>
        <img id="main-img" alt="" />
        <button class="stage-nav prev" id="prev" type="button" aria-label="Foto anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m14.7 6.7-1.4-1.4L6.6 12l6.7 6.7 1.4-1.4L9.4 12l5.3-5.3Z"/></svg>
        </button>
        <button class="stage-nav next" id="next" type="button" aria-label="Foto siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m9.3 17.3 1.4 1.4 6.7-6.7-6.7-6.7-1.4 1.4 5.3 5.3-5.3 5.3Z"/></svg>
        </button>
        <span class="count" id="count">0 / 0</span>
      </div>
      <div class="thumbs" id="thumbs" aria-label="Miniaturas"></div>
    </section>
  </main>

  <footer class="shell site-footer">
    <span>Para la gloria de Dios y la edificación de su iglesia.</span>
    <span>Hecho con ♥ por <strong>D.R</strong></span>
  </footer>

  <script>
    (function () {
      // Las fotos se detectan solas: gallery/photo1.jpg, photo2.jpg, ... hasta MAX_PHOTOS.
      const MAX_PHOTOS = 30;
      const images = [];
      const stage = document.getElementById('stage');
      const mainImg = document.getElementById('main-img');
      const backdrop = document.getElementById('backdrop');
      const thumbs = document.getElementById('thumbs');
      const count = document.getElementById('count');
      let current = 0;

      function probe(src) {
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = src;
        });
      }

      async function build() {
        const candidates = Array.from({ length: MAX_PHOTOS }, (_, i) => `gallery/photo${i + 1}.jpg`);
        const found = await Promise.all(candidates.map(probe));
        candidates.forEach((src, i) => { if (found[i]) images.push(src); });

        if (!images.length) {
          const box = document.createElement('div');
          box.className = 'message';
          box.textContent = 'Todavía no hay fotos en la galería.';
          document.getElementById('galeria').replaceChildren(box);
          return;
        }

        images.forEach((src, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'thumb';
          button.setAttribute('aria-label', `Ver foto ${index + 1}`);
          const img = new Image();
          img.src = src;
          img.alt = '';
          img.loading = 'lazy';
          button.append(img);
          button.addEventListener('click', () => show(index));
          thumbs.append(button);
        });

        show(0, true);
      }

      function show(index, instant) {
        current = (index + images.length) % images.length;
        const src = images[current];
        const apply = () => {
          mainImg.src = src;
          mainImg.alt = `Foto ${current + 1} de la comunidad Somos Uno`;
          backdrop.style.backgroundImage = `url("${src}")`;
          mainImg.classList.remove('is-changing');
        };
        count.textContent = `${current + 1} / ${images.length}`;
        [...thumbs.children].forEach((thumb, i) => {
          thumb.classList.toggle('is-active', i === current);
          thumb.setAttribute('aria-current', i === current);
        });
        if (instant) return apply();
        mainImg.classList.add('is-changing');
        setTimeout(apply, 150);
      }

      document.getElementById('prev').addEventListener('click', () => show(current - 1));
      document.getElementById('next').addEventListener('click', () => show(current + 1));

      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') show(current - 1);
        if (event.key === 'ArrowRight') show(current + 1);
      });

      let startX = 0;
      let startY = 0;
      stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
      stage.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(current + (dx < 0 ? 1 : -1));
      });

      const topbar = document.getElementById('topbar');
      addEventListener('scroll', () => topbar.classList.toggle('is-scrolled', scrollY > 8), { passive: true });

      build();
    })();
  </script>
</body>
</html>
